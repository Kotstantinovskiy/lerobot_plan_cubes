[project]
name = "so101-control-3d"
version = "0.1.0"
description = "Local mouse control for a calibrated SO-101 arm on macOS"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.12,<4",
    "numpy>=1.24,<3",
    "scipy>=1.14,<2",
    "viser==1.1.1",
    "yourdfpy>=0.0.58,<0.1",
    "qrcode>=8,<9",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
