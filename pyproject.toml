# Lint and format settings for the whole repository: uvx ruff check . && uvx ruff format .
# The environment lives elsewhere, in ../lerobot_cubes.
[tool.ruff]
line-length = 120
target-version = "py310"
src = [".", "diagnostics", "inference", "recording", "tests", "training"]
extend-exclude = ["camera_check", "data", "outputs", "runs"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "SIM", "UP"]
